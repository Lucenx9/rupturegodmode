name: CI

on:
  push:
  pull_request:

jobs:
  controller-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run controller tests
        run: scripts/test.sh

  plugin-build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: AlienXAXS/StarRupture-Plugin-SDK
          ref: v1.17.3
          path: plugin-sdk
      - uses: actions/checkout@v4
        with:
          repository: AlienXAXS/StarRupture-Game-SDK
          ref: 2c7d138506e42011d1ccf4ee044339c154b45b90
          path: game-sdk
      - uses: microsoft/setup-msbuild@v2
      - name: Build plugin
        shell: pwsh
        run: |
          msbuild RuptureGodMode.sln `
            /p:Configuration="Client Release" `
            /p:Platform=x64 `
            /p:GameSDKRoot="${{ github.workspace }}\game-sdk" `
            /p:PluginSDKInclude="${{ github.workspace }}\plugin-sdk\include" `
            /m /v:minimal
